[metadata]
name = lib-pybroker
version = attr: pybroker.__version__
url = http://www.pybroker.com
author = Edward West
author_email = edwest@pybroker.com
description = Algorithmic trading with machine learning
long_description = file: README.md
long_description_content_type = text/markdown
license = Apache License 2.0 with Commons Clause
license_files = LICENSE
classifiers = License :: Free for non-commercial use

[options]
package_dir =
    =src
packages = find:
include_package_data = True
python_requires = >=3.11
install_requires =
    optuna>=3.1,<5
    alpaca-py>=0.10.0,<1
    diskcache>=5.4.0,<6
    joblib>=1.2.0,<2
    numba>=0.64.0,<1
    numpy>=1.26.4,<3
    pandas>=2.2.0,<4
    progressbar2>=4.1.1,<5
    yahooquery>=2.3.7,<3
    yfinance>=0.2.55,<2

[options.extras_require]
test =
    akshare>=1.17.50,<2
    arch>=8,<9
    pytest
    pytest-cov
    pytest-instafail
    pytest-randomly
    pytest-xdist
    ray>=2.9.0,<3

[options.packages.find]
where = src
exclude =
    tests*

[mypy]
python_version = 3.11
warn_unused_configs = True
show_error_context = True
pretty = True
namespace_packages = True
check_untyped_defs = True

[tox:tox]
envlist = py311,py312,py313
isolated_build = True

[testenv]
extras = test
commands =
    pytest {posargs}

[testenv:typecheck]
basepython = python3.12
download = true
deps =
    pandas>=3.0.1
    numpy>=2.0.0,<2.5
    mypy==2.3.0
commands =
    mypy --show-error-codes --ignore-missing-imports --warn-unused-ignores {posargs:src}

[testenv:format]
skip_install = True
deps =
    ruff
commands =
    ruff format {posargs:--diff src tests}

[testenv:lint]
skip_install = True
deps =
    ruff
commands =
    ruff check {posargs:src tests}

[testenv:docs]
deps =
    -r requirements.txt
commands =
    sphinx-build -n -W --keep-going -b html docs/source/ docs/_build/

[tool:pytest]
testpaths = tests
addopts = --strict-markers
xfail_strict = True

[coverage:run]
branch = True

[coverage:report]
show_missing = True

[coverage:paths]
source =
    src/pybroker
    */site-packages/pybroker