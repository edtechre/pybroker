name: Schedule

on:
  schedule:
    - cron: '0 12 * * *'

# The default GITHUB_TOKEN scope depends on a repository setting, so
# declare it here: every job in this workflow only reads the checkout.
permissions:
  contents: read

jobs:
  # Single source of truth for every Python version this workflow uses.
  # `versions` drives the test matrix; `tooling` pins the one interpreter
  # that runs format, lint, typecheck, docs and the sdist build. Editing
  # .github/python-versions.json changes all of them at once.
  versions:
    name: Resolve Python versions
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.read.outputs.versions }}
      tooling: ${{ steps.read.outputs.tooling }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Read .github/python-versions.json
        id: read
        run: |
          set -euo pipefail
          # jq -e exits non-zero on a null result, and assigning a failed
          # command substitution aborts under `set -e`, so a renamed or
          # mistyped key fails here instead of silently emitting an empty
          # matrix that skips every leg. Interpolating jq directly into
          # `echo` would swallow that exit status.
          VERSIONS="$(jq -ce '.versions' .github/python-versions.json)"
          TOOLING="$(jq -re '.tooling' .github/python-versions.json)"
          {
            echo "versions=${VERSIONS}"
            echo "tooling=${TOOLING}"
          } >> "$GITHUB_OUTPUT"

  # The sites below cannot read the JSON. This asserts they agree with it.
  verify-versions:
    name: Verify version declarations
    needs: versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ needs.versions.outputs.tooling }}

      - name: Check declaration sites against the matrix
        run: python .github/scripts/check_python_versions.py

  # The same two gates main.yml runs, with the network the nightly has and
  # a pull request does not: zizmor adds its online audits (a GHSA filed
  # against a pinned action), and pinact cross-checks each SHA against the
  # tag its comment names -- a comment claiming v7 over a fork's commit is
  # only detectable from upstream.
  workflow-audit:
    name: Audit workflows
    needs: versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Reports, never fails. A pin merely *behind* its tag is safe by
      # construction, and this cannot tell that apart from a comment that
      # lies. Five of the pinned actions ride moving major tags (# v7,
      # # v5), and Dependabot's 7-day cooldown guarantees a week-long
      # stale window after each upstream release -- blocking here would
      # turn every one of those releases into a red build, which is the
      # treadmill that makes people abandon pinning altogether.
      - name: Verify version comments against upstream tags
        uses: suzuki-shunsuke/pinact-action@896d595f299e71d65b9d28349d6956abe144390a # v3.0.0
        continue-on-error: true
        with:
          fix: "false"
          verify: "true"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ needs.versions.outputs.tooling }}

      - name: Install tox
        run: python -m pip install --no-cache-dir tox

      # No --offline here, unlike main.yml: with a token zizmor also runs
      # its online audits.
      - name: Run zizmor
        if: always()
        run: tox -e zizmor -- .
        env:
          GH_TOKEN: ${{ github.token }}

  format:
    name: Check formatting
    needs: versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ needs.versions.outputs.tooling }}

      - name: Install tox
        run: python -m pip install --no-cache-dir tox

      - name: Run ruff
        run: tox -e format

  lint:
    name: Lint
    needs: versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ needs.versions.outputs.tooling }}

      - name: Install tox
        run: python -m pip install --no-cache-dir tox

      - name: Run ruff
        run: tox -e lint

  typecheck:
    name: Type check
    needs: versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ needs.versions.outputs.tooling }}

      - name: Install tox
        run: python -m pip install --no-cache-dir tox

      - name: Run mypy
        run: python -m tox -e typecheck

  docs:
    name: Build docs
    needs: versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ needs.versions.outputs.tooling }}

      - name: Install pandoc
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pandoc

      - name: Install tox
        run: python -m pip install --no-cache-dir tox

      - name: Run sphinx-build
        run: tox -e docs

  test:
    name: Test
    needs: versions
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ${{ fromJSON(needs.versions.outputs.versions) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true

      - name: Install tox
        run: python -m pip install --no-cache-dir tox

      # The tox env name is derived, never stored, so it cannot drift from
      # the matrix. setup.cfg's envlist is held to the same list by
      # verify-versions.
      - name: Run pytest
        env:
          PY_VERSION: ${{ matrix.python }}
        run: tox -e "py${PY_VERSION//./}"

  build_source_dist:
      name: Build source distribution
      needs: versions
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
          with:
            persist-credentials: false

        - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
          with:
            python-version: ${{ needs.versions.outputs.tooling }}

        - name: Install build
          run: python -m pip install build

        - name: Run build
          run: python -m build --sdist

        - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
          with:
            path: ./dist/*.tar.gz
