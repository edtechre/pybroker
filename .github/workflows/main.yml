name: Package

on:
  - push

# The default GITHUB_TOKEN scope depends on a repository setting, so
# declare it here: every job in this workflow only reads the checkout.
permissions:
  contents: read

jobs:
  # Single source of truth for every Python version this workflow uses.
  # `versions` drives the test matrix; `tooling` pins the one interpreter
  # that runs format, lint, typecheck, docs and the sdist build. Editing
  # .github/python-versions.json changes all of them at once.
  versions:
    name: Resolve Python versions
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.read.outputs.versions }}
      tooling: ${{ steps.read.outputs.tooling }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Read .github/python-versions.json
        id: read
        run: |
          set -euo pipefail
          # jq -e exits non-zero on a null result, and assigning a failed
          # command substitution aborts under `set -e`, so a renamed or
          # mistyped key fails here instead of silently emitting an empty
          # matrix that skips every leg. Interpolating jq directly into
          # `echo` would swallow that exit status.
          VERSIONS="$(jq -ce '.versions' .github/python-versions.json)"
          TOOLING="$(jq -re '.tooling' .github/python-versions.json)"
          {
            echo "versions=${VERSIONS}"
            echo "tooling=${TOOLING}"
          } >> "$GITHUB_OUTPUT"

  # The sites below cannot read the JSON. This asserts they agree with it.
  verify-versions:
    name: Verify version declarations
    needs: versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ needs.versions.outputs.tooling }}

      - name: Check declaration sites against the matrix
        run: python .github/scripts/check_python_versions.py

  # Two independent gates over the workflow files themselves. pinact owns
  # pinning: every external `uses:` must be a full commit SHA carrying a
  # trailing `# <version>` comment, since a bare SHA is unreviewable and
  # is also what the nightly cross-checks against upstream. zizmor owns
  # everything else -- credential persistence, token scopes, template
  # injection, secrets handling.
  workflow-audit:
    name: Audit workflows
    needs: versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # `fix: false` is check-only: it never edits a file and never
      # pushes, so `contents: read` is enough. `no_api: true` keeps this
      # gate offline, which is what lets it block every pull request
      # without depending on the GitHub API being reachable.
      - name: Check pins and version comments
        uses: suzuki-shunsuke/pinact-action@896d595f299e71d65b9d28349d6956abe144390a # v3.0.0
        with:
          fix: "false"
          no_api: "true"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ needs.versions.outputs.tooling }}

      - name: Install tox
        run: python -m pip install --no-cache-dir tox

      # `always()` so an unpinned action above cannot hide the security
      # findings below: these are independent gates sharing one checkout.
      - name: Run zizmor
        if: always()
        run: tox -e zizmor

  format:
    name: Check formatting
    needs: versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ needs.versions.outputs.tooling }}

      - name: Install tox
        run: python -m pip install --no-cache-dir tox

      - name: Run ruff
        run: tox -e format

  lint:
    name: Lint
    needs: versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ needs.versions.outputs.tooling }}

      - name: Install tox
        run: python -m pip install --no-cache-dir tox

      - name: Run ruff
        run: tox -e lint

  typecheck:
    name: Type check
    needs: versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ needs.versions.outputs.tooling }}

      - name: Install tox
        run: python -m pip install --no-cache-dir tox

      - name: Run mypy
        run: python -m tox -e typecheck

  docs:
    name: Build docs
    needs: versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ needs.versions.outputs.tooling }}

      - name: Install pandoc
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pandoc

      - name: Install tox
        run: python -m pip install --no-cache-dir tox

      - name: Run sphinx-build
        run: tox -e docs

  test:
    name: Test
    needs: versions
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ${{ fromJSON(needs.versions.outputs.versions) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true

      - name: Install tox
        run: python -m pip install --no-cache-dir tox

      # The tox env name is derived, never stored, so it cannot drift from
      # the matrix. setup.cfg's envlist is held to the same list by
      # verify-versions.
      - name: Run pytest
        env:
          PY_VERSION: ${{ matrix.python }}
        run: tox -e "py${PY_VERSION//./}"

  build_source_dist:
      name: Build source distribution
      needs: versions
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
          with:
            persist-credentials: false

        - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
          with:
            python-version: ${{ needs.versions.outputs.tooling }}

        - name: Install build
          run: python -m pip install build

        - name: Run build
          run: python -m build --sdist

        - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
          with:
            path: ./dist/*.tar.gz

  publish:
    name: Publish package
    if: startsWith(github.event.ref, 'refs/tags/v')
    needs:
      - verify-versions
      - workflow-audit
      - format
      - lint
      - typecheck
      - docs
      - test
      - build_source_dist
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: artifact
          path: ./dist

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
